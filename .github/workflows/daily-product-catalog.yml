
name: Daily AI Product Catalog Improvement

on:
  workflow_dispatch:
  schedule:
    # 5:00 PM Philippines time (09:00 UTC)
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: daily-product-catalog
  cancel-in-progress: false

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout product catalog app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Request a small Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error("GEMINI_API_KEY repository secret is missing.");
            }

            const modelsResponse = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`
            );

            if (!modelsResponse.ok) {
              throw new Error(
                `Model discovery failed: HTTP ${modelsResponse.status}`
              );
            }

            const modelData = await modelsResponse.json();
            const availableModels = (modelData.models || []).filter(item =>
              item.supportedGenerationMethods?.includes("generateContent")
            );

            // Prefer newer models, but only select models returned by the API.
            const preferredModels = [
              "models/gemini-3.8-flash",
              "models/gemini-3.7-flash",
              "models/gemini-3.6-flash",
              "models/gemini-3.5-flash",
              "models/gemini-3.5-flash-lite",
              "models/gemini-3.1-flash-lite",
              "models/gemini-3-flash-preview"
            ];

            const model =
              preferredModels
                .map(name => availableModels.find(item => item.name === name))
                .find(Boolean) ||
              availableModels.find(item =>
                /flash/i.test(item.name) &&
                !/gemini-2\.5-flash/i.test(item.name)
              );

            if (!model) {
              throw new Error(
                "No supported preferred Flash model was found. Check the available models for your API key."
              );
            }

            const modelName = model.name.replace(/^models\//, "");
            console.log(`Using available model: ${modelName}`);

            const prompt = [
              "You are reviewing a student React product catalog application.",
              "Do not generate code, patches, or diffs.",
              "Give exactly three concise, actionable suggestions.",
              "Focus on usability, accessibility, or maintainability.",
              "Use a numbered list and keep the entire response under 120 words.",
              "Do not claim to have inspected files you have not seen."
            ].join("\n");

            let lastError;

            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const response = await fetch(
                  `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: {
                        maxOutputTokens: 350,
                        temperature: 0.2
                      }
                    })
                  }
                );

                if (response.status === 429 || response.status >= 500) {
                  throw new Error(
                    `Temporary Gemini HTTP ${response.status}: ${await response.text()}`
                  );
                }

                if (!response.ok) {
                  throw new Error(
                    `Gemini HTTP ${response.status}: ${await response.text()}`
                  );
                }

                const data = await response.json();
                const candidate = data.candidates?.[0];
                const review = candidate?.content?.parts
                  ?.map(part => part.text || "")
                  .join("")
                  .trim();

                if (!review) {
                  throw new Error("Gemini returned an empty review.");
                }

                if (candidate.finishReason === "MAX_TOKENS") {
                  throw new Error(
                    "Gemini output was truncated. Reduce the requested response length."
                  );
                }

                console.log("Gemini review completed successfully.");
                console.log(review);
                return;
              } catch (error) {
                lastError = error;
                console.error(
                  `Attempt ${attempt}/4 failed: ${error.message}`
                );

                // Retrying won't fix invalid model names or other client errors.
                if (
                  /HTTP 400|HTTP 401|HTTP 403|HTTP 404/.test(error.message)
                ) {
                  break;
                }

                if (attempt < 4) {
                  const delay = attempt * 2000;
                  console.log(`Retrying in ${delay} ms.`);
                  await sleep(delay);
                }
              }
            }

            throw lastError || new Error("Gemini request failed.");
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
