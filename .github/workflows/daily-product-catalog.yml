
name: Daily AI Product Catalog Improvement

on:
  workflow_dispatch:
  schedule:
    # 5:00 PM Philippines time (09:00 UTC)
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: daily-product-catalog
  cancel-in-progress: false

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate daily Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function request(url, options = {}, retries = 3) {
            let lastError;

            for (let attempt = 0; attempt <= retries; attempt++) {
              try {
                const response = await fetch(url, {
                  ...options,
                  signal: AbortSignal.timeout(60000)
                });

                if (response.status === 404) {
                  return { unavailable: true };
                }

                if (response.status === 429 || response.status >= 500) {
                  throw new Error(
                    `HTTP ${response.status}: ${await response.text()}`
                  );
                }

                if (!response.ok) {
                  throw new Error(
                    `HTTP ${response.status}: ${await response.text()}`
                  );
                }

                return { data: await response.json() };
              } catch (error) {
                lastError = error;

                if (/HTTP 400|HTTP 401|HTTP 403/.test(error.message)) {
                  throw error;
                }

                if (attempt === retries) break;

                const delay = Math.min(2000 * (2 ** attempt), 20000);
                const jitter = Math.floor(Math.random() * 1000);

                console.log(
                  `Temporary error. Retrying in ${delay + jitter} ms.`
                );

                await sleep(delay + jitter);
              }
            }

            throw lastError || new Error("Request failed.");
          }

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error("GEMINI_API_KEY repository secret is missing.");
            }

            console.log("Discovering Gemini models available to this API key.");

            const modelResponse = await request(
              "https://generativelanguage.googleapis.com/v1beta/models",
              {
                headers: {
                  "x-goog-api-key": apiKey
                }
              }
            );

            const models = (modelResponse.data?.models || [])
              .filter(model =>
                model.supportedGenerationMethods?.includes("generateContent") &&
                /flash/i.test(model.name) &&
                !/gemini-2\.5-flash/i.test(model.name)
              )
              .sort((a, b) => {
                const rank = name =>
                  name.includes("gemini-3.8-flash") ? 0 :
                  name.includes("gemini-3.6-flash") ? 1 :
                  name.includes("gemini-3.5-flash") ? 2 : 3;

                return rank(a.name) - rank(b.name);
              });

            if (!models.length) {
              throw new Error(
                "No eligible Flash models were found for this API key."
              );
            }

            const prompt = [
              "Write a daily review for a student React product catalog project.",
              "You have not been given its source code, so do not claim to have inspected it.",
              "Give exactly three practical suggestions about accessibility, usability, testing, or maintainability.",
              "Avoid repetitive generic advice where possible.",
              "Use a Markdown heading and a numbered list.",
              "Keep the report under 180 words."
            ].join("\n");

            let review = "";
            let lastModelError = "";

            for (const model of models) {
              console.log(`Trying model: ${model.name}`);

              try {
                const result = await request(
                  `https://generativelanguage.googleapis.com/v1beta/${model.name}:generateContent`,
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "x-goog-api-key": apiKey
                    },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: {
                        maxOutputTokens: 500,
                        temperature: 0.3
                      }
                    })
                  }
                );

                if (result.unavailable) {
                  console.log(`${model.name} returned 404; trying next model.`);
                  continue;
                }

                const candidate = result.data.candidates?.[0];

                review = candidate?.content?.parts
                  ?.map(part => part.text || "")
                  .join("")
                  .trim() || "";

                if (review) {
                  console.log(`Review generated using ${model.name}.`);
                  break;
                }

                lastModelError = `${model.name} returned empty output.`;
                console.log(lastModelError);
              } catch (error) {
                lastModelError = `${model.name}: ${error.message}`;
                console.error(lastModelError);
              }
            }

            if (!review) {
              throw new Error(
                `All eligible models failed. No report was written. ${lastModelError}`
              );
            }

            const fs = await import("node:fs/promises");

            const date = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Manila",
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).format(new Date());

            await fs.mkdir("reports", { recursive: true });

            await fs.writeFile(
              "reports/daily-review.md",
              `# Daily Product Catalog Review\n\nDate: ${date}\n\n${review}\n`,
              "utf8"
            );

            console.log("Saved reports/daily-review.md");
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Commit and push daily review
        env:
          GH_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
          GH_NAME: ${{ secrets.COMMIT_AUTHOR_NAME }}
        run: |
          set -euo pipefail

          git config user.name "${GH_NAME:-github-actions[bot]}"
          git config user.email "${GH_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

          git add reports/daily-review.md

          if git diff --cached --quiet; then
            echo "The report has not changed. Skipping commit."
            exit 0
          fi

          git commit -m "docs: add daily AI product catalog review"
          git push origin HEAD:main
