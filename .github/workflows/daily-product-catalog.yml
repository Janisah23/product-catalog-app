
name: Daily AI Product Catalog Improvement

on:
  workflow_dispatch:
  schedule:
    # 5:00 PM Philippines time (09:00 UTC)
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: daily-product-catalog
  cancel-in-progress: false

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate a dated Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function request(url, options = {}, retries = 3) {
            let lastError;

            for (let attempt = 0; attempt <= retries; attempt++) {
              try {
                const response = await fetch(url, {
                  ...options,
                  signal: AbortSignal.timeout(60000)
                });

                if (response.status === 404) {
                  return { unavailable: true };
                }

                if (response.status === 429 || response.status >= 500) {
                  throw new Error(
                    `HTTP ${response.status}: ${await response.text()}`
                  );
                }

                if (!response.ok) {
                  throw new Error(
                    `HTTP ${response.status}: ${await response.text()}`
                  );
                }

                return { data: await response.json() };
              } catch (error) {
                lastError = error;

                if (/HTTP 400|HTTP 401|HTTP 403/.test(error.message)) {
                  throw error;
                }

                if (attempt === retries) break;

                const delay = Math.min(3000 * (2 ** attempt), 20000);
                const jitter = Math.floor(Math.random() * 1000);

                console.log(`Retrying in ${delay + jitter} ms.`);
                await sleep(delay + jitter);
              }
            }

            throw lastError || new Error("Request failed.");
          }

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error("GEMINI_API_KEY secret is missing.");
            }

            const listing = await request(
              "https://generativelanguage.googleapis.com/v1beta/models",
              {
                headers: { "x-goog-api-key": apiKey }
              }
            );

            const models = (listing.data?.models || [])
              .filter(model =>
                model.supportedGenerationMethods?.includes("generateContent") &&
                /flash/i.test(model.name) &&
                !/gemini-2\.5-flash/i.test(model.name)
              )
              .sort((a, b) => {
                const rank = name =>
                  name.includes("gemini-3.8-flash") ? 0 :
                  name.includes("gemini-3.6-flash") ? 1 :
                  name.includes("gemini-3.5-flash") ? 2 : 3;
                return rank(a.name) - rank(b.name);
              });

            if (!models.length) {
              throw new Error("No eligible Flash models are available.");
            }

            const prompt = [
              "Write a daily review for a student React + Vite + TypeScript product catalog project.",
              "You have not been given source files. Do not claim to have inspected the code.",
              "Give exactly three useful, specific suggestions about accessibility, usability, testing, or maintainability.",
              "Use a Markdown heading and numbered list.",
              "Keep the report under 180 words."
            ].join("\n");

            let review = "";
            let lastError = "";

            for (const model of models) {
              console.log(`Trying model: ${model.name}`);

              try {
                const result = await request(
                  `https://generativelanguage.googleapis.com/v1beta/${model.name}:generateContent`,
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "x-goog-api-key": apiKey
                    },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: {
                        maxOutputTokens: 500,
                        temperature: 0.4
                      }
                    })
                  }
                );

                if (result.unavailable) {
                  console.log("Model unavailable; trying the next model.");
                  continue;
                }

                review = result.data.candidates?.[0]?.content?.parts
                  ?.map(part => part.text || "")
                  .join("")
                  .trim() || "";

                if (review) {
                  console.log(`Review generated using ${model.name}.`);
                  break;
                }
              } catch (error) {
                lastError = error.message;
                console.error(`${model.name}: ${lastError}`);
              }
            }

            if (!review) {
              throw new Error(
                `No model generated a review. ${lastError}`
              );
            }

            const fs = await import("node:fs/promises");

            const date = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Manila",
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).format(new Date());

            const filePath = `reports/${date}.md`;

            await fs.mkdir("reports", { recursive: true });
            await fs.writeFile(
              filePath,
              `# Daily Product Catalog Review\n\nDate: ${date}\n\n${review}\n`,
              "utf8"
            );

            console.log(`Saved ${filePath}`);
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Commit and push daily report
        env:
          GH_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
          GH_NAME: ${{ secrets.COMMIT_AUTHOR_NAME }}
        run: |
          set -euo pipefail

          git config user.name "${GH_NAME:-github-actions[bot]}"
          git config user.email "${GH_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

          git add reports/

          if git diff --cached --quiet; then
            echo "No new report was created; skipping commit."
            exit 0
          fi

          git commit -m "docs: add daily product catalog review"
          git push origin HEAD:main
