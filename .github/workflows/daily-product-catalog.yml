
name: Daily AI Product Catalog Improvement

on:
  workflow_dispatch:
  schedule:
    # 5:00 PM Philippines time (09:00 UTC)
    - cron: "0 9 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-product-catalog-ai
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Configure Git identity
        env:
          AUTHOR_NAME: ${{ secrets.GITHUB_AUTHOR_NAME }}
          AUTHOR_EMAIL: ${{ secrets.GITHUB_AUTHOR_EMAIL }}
        run: |
          git config user.name "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Generate and validate AI improvement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          async function fetchWithRetry(url, options = {}, maxRetries = 4) {
            for (let attempt = 0; ; attempt++) {
              let response;

              try {
                response = await fetch(url, {
                  ...options,
                  signal: AbortSignal.timeout(60000),
                });
              } catch (error) {
                if (attempt >= maxRetries) {
                  throw new Error(
                    `Request failed after ${attempt + 1} attempts: ${error.message}`
                  );
                }

                const delay = Math.min(1000 * 2 ** attempt, 16000);
                const jitter = Math.random() * 1000;

                console.log(
                  `Network error. Retrying in ${Math.round(delay + jitter)} ms ` +
                  `(attempt ${attempt + 1}/${maxRetries}).`
                );

                await sleep(delay + jitter);
                continue;
              }

              if (response.ok) {
                return response;
              }

              const retryable = [
                408, 429, 500, 502, 503, 504
              ].includes(response.status);

              if (!retryable || attempt >= maxRetries) {
                return response;
              }

              const status = response.status;

              // Consume the response body before making another request.
              await response.text();

              const delay = Math.min(1000 * 2 ** attempt, 16000);
              const jitter = Math.random() * 1000;

              console.log(
                `HTTP ${status}. Retrying in ${Math.round(delay + jitter)} ms ` +
                `(attempt ${attempt + 1}/${maxRetries}).`
              );

              await sleep(delay + jitter);
            }
          }

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error("Missing GEMINI_API_KEY repository secret.");
            }

            // Collect eligible, tracked source files.
            const tracked = execFileSync(
              "git",
              ["ls-files", "-z"],
              { encoding: "utf8" }
            ).split("\0").filter(Boolean);

            const allowed = tracked.filter(path =>
              /^(src|public)\//.test(path) &&
              /\.(js|jsx|ts|tsx|css|scss|html)$/.test(path) &&
              !/(^|\/)(node_modules|dist|build|coverage)\//.test(path) &&
              !path.endsWith(".min.js")
            );

            const files = [];
            let total = 0;

            for (const path of allowed) {
              const content = fs.readFileSync(path, "utf8");

              if (
                content.length > 12000 ||
                total + content.length > 45000
              ) {
                console.log(`Skipping oversized source file: ${path}`);
                continue;
              }

              files.push({ path, content });
              total += content.length;
            }

            if (!files.length) {
              throw new Error(
                "No suitable tracked source files found under src/ or public/."
              );
            }

            console.log(`Loaded ${files.length} source files for review.`);

            // Discover models available to this API key.
            const modelsResponse = await fetchWithRetry(
              "https://generativelanguage.googleapis.com/v1beta/models",
              {
                headers: {
                  "x-goog-api-key": apiKey,
                },
              }
            );

            if (!modelsResponse.ok) {
              throw new Error(
                `Gemini model lookup failed: HTTP ${modelsResponse.status} ` +
                (await modelsResponse.text()).slice(0, 1500)
              );
            }

            const modelData = await modelsResponse.json();

            const available = (modelData.models || [])
              .filter(model =>
                (model.supportedGenerationMethods || [])
                  .includes("generateContent")
              )
              .map(model => model.name.replace(/^models\//, ""));

            const preferred = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3-flash",
            ];

            const modelsToTry = [
              ...preferred.filter(name => available.includes(name)),
              ...available.filter(name =>
                name.toLowerCase().includes("flash") &&
                !preferred.includes(name)
              ),
            ];

            // Remove duplicate model names while preserving order.
            const uniqueModels = [...new Set(modelsToTry)];

            if (!uniqueModels.length) {
              throw new Error(
                "No available Gemini Flash model supports generateContent. " +
                "Check the models available to your API key."
              );
            }

            console.log(
              `Found ${uniqueModels.length} candidate Flash model(s).`
            );

            const prompt = `
          You are helping improve an existing React product catalog application.
          Review the supplied source files and propose ONE small, useful, safe improvement.

          Requirements:
          - Preserve the existing framework, style, architecture, and conventions.
          - Focus on product browsing, accessibility, responsive layout, usability,
            loading/empty/error states, or a small UI polish improvement.
          - Make only a focused change supported by the supplied source.
          - Do not invent backend endpoints, product data, credentials, or features.
          - Do not change dependencies, package manifests, lockfiles, workflows,
            environment files, Firebase configuration, or server security rules.
          - Do not remove existing functionality.
          - Only modify existing files under src/ or public/.
          - Return a valid unified Git diff, including diff --git, --- and +++ headers.
          - Do not wrap the diff in Markdown fences or include explanations.
          - If no safe, worthwhile improvement is possible, return exactly NO_CHANGE.

          Source files:
          ${files.map(file =>
            `\n--- FILE: ${file.path} ---\n${file.content}`
          ).join("\n")}
          `;

            let response;
            let selectedModel;

            // Retry each model, then try another candidate if needed.
            for (const model of uniqueModels) {
              console.log(`Trying Gemini model: ${model}`);

              const candidateResponse = await fetchWithRetry(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey,
                  },
                  body: JSON.stringify({
                    contents: [
                      {
                        parts: [
                          { text: prompt }
                        ]
                      }
                    ],
                    generationConfig: {
                      temperature: 0.2,
                      maxOutputTokens: 6000,
                    },
                  }),
                }
              );

              if (candidateResponse.ok) {
                response = candidateResponse;
                selectedModel = model;
                break;
              }

              const status = candidateResponse.status;
              const errorText = await candidateResponse.text();

              console.error(
                `Model ${model} failed with HTTP ${status}: ` +
                errorText.slice(0, 1200)
              );

              // Fall back only for errors likely to be temporary or
              // specific to a model's availability.
              const canFallback = [
                404, 408, 429, 500, 502, 503, 504
              ].includes(status);

              if (!canFallback) {
                throw new Error(
                  `Gemini request failed: HTTP ${status} ${errorText}`
                );
              }

              console.log(`Falling back from ${model}, if another model is available.`);
            }

            if (!response) {
              throw new Error(
                "All candidate Gemini Flash models failed after retries. " +
                "No changes were applied."
              );
            }

            console.log(`Generation succeeded using ${selectedModel}.`);

            const result = await response.json();

            if (result.promptFeedback?.blockReason) {
              throw new Error(
                `Gemini blocked the prompt: ${result.promptFeedback.blockReason}`
              );
            }

            const candidate = result.candidates?.[0];

            if (candidate?.finishReason === "MAX_TOKENS") {
              throw new Error(
                "Gemini output was truncated. No changes were applied."
              );
            }

            let output = (candidate?.content?.parts || [])
              .map(part => part.text || "")
              .join("\n")
              .trim();

            if (!output) {
              throw new Error(
                `Gemini returned an empty response. Finish reason: ${
                  candidate?.finishReason || "unknown"
                }`
              );
            }

            if (output === "NO_CHANGE") {
              console.log("Gemini found no safe improvement today.");
              fs.writeFileSync("/tmp/no-change", "true");
              return;
            }

            // Remove optional Markdown fences.
            output = output
              .replace(/^```(?:diff|patch)?\s*/i, "")
              .replace(/\s*```$/, "")
              .trim();

            const start = output.indexOf("diff --git ");

            if (start >= 0) {
              output = output.slice(start);
            }

            if (!output.startsWith("diff --git ")) {
              console.log(
                "Gemini response preview:",
                output.slice(0, 1500)
              );

              throw new Error(
                "Gemini did not return a valid unified Git diff."
              );
            }

            const patchPath = "/tmp/product-catalog.patch";

            fs.writeFileSync(patchPath, output + "\n");

            const changedPaths = [
              ...output.matchAll(
                /^diff --git a\/(.+?) b\/(.+)$/gm
              )
            ].map(match => [match[1], match[2]]);

            if (!changedPaths.length) {
              throw new Error("Patch contains no file changes.");
            }

            // Reject changes outside the permitted source files.
            for (const [oldPath, newPath] of changedPaths) {
              if (
                oldPath !== newPath ||
                !tracked.includes(oldPath) ||
                !/^(src|public)\//.test(oldPath) ||
                !/\.(js|jsx|ts|tsx|css|scss|html)$/.test(oldPath) ||
                /(^|\/)(node_modules|dist|build|coverage)\//.test(oldPath) ||
                oldPath.endsWith(".min.js")
              ) {
                throw new Error(
                  `Rejected unsafe or unsupported file change: ` +
                  `${oldPath} -> ${newPath}`
                );
              }
            }

            // Validate the patch before applying anything.
            execFileSync(
              "git",
              ["apply", "--check", patchPath],
              { stdio: "inherit" }
            );

            execFileSync(
              "git",
              ["apply", patchPath],
              { stdio: "inherit" }
            );

            const changed = execFileSync(
              "git",
              ["diff", "--name-only"],
              { encoding: "utf8" }
            ).trim();

            if (!changed) {
              console.log("Patch produced no changes.");
              fs.writeFileSync("/tmp/no-change", "true");
              return;
            }

            console.log(
              `AI improvement applied using ${selectedModel}:\n${changed}`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop if no improvement was produced
        id: changes
        shell: bash
        run: |
          if [ -f /tmp/no-change ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No root package.json found."
            exit 1
          fi

      - name: Run available checks
        if: steps.changes.outputs.has_changes == 'true'
        env:
          CI: "true"
        run: |
          node -e "
            const p = require('./package.json');
            console.log(
              'Available npm scripts:',
              JSON.stringify(p.scripts || {})
            );
          "

          node <<'NODE'
          const { execFileSync } = require("child_process");
          const scripts = require("./package.json").scripts || {};

          function run(script, args = []) {
            console.log(`Running npm ${script} ${args.join(" ")}`);
            execFileSync("npm", [script, ...args], {
              stdio: "inherit"
            });
          }

          if (scripts.typecheck) {
            run("run", ["typecheck"]);
          }

          if (scripts.lint) {
            run("run", ["lint"]);
          }

          if (scripts.test) {
            console.log("Running the project's test script.");
            run("test", ["--", "--run"]);
          }

          if (scripts.build) {
            run("run", ["build"]);
          }

          if (
            !scripts.typecheck &&
            !scripts.lint &&
            !scripts.test &&
            !scripts.build
          ) {
            console.log(
              "Warning: no standard typecheck, lint, test, or build script was found."
            );
          }
          NODE

      - name: Create improvement branch and commit
        if: steps.changes.outputs.has_changes == 'true'
        id: commit
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="ai-daily-updates-${RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git add -- src public
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No eligible changes to commit."
            exit 0
          fi

          git commit -m "chore: daily AI product catalog improvement"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Open pull request for review
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BRANCH" ]; then
            echo "No improvement branch was created."
            exit 0
          fi

          EXISTING_PR=$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Daily AI Product Catalog Improvement" \
              --body "Automated, AI-assisted product catalog improvement. Please review the code and checks before merging."
          else
            echo "Pull request #$EXISTING_PR already exists."
          fi
