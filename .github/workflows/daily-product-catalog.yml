
      - name: Generate daily Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error("GEMINI_API_KEY secret is missing.");
            }

            const models = [
              "gemini-3.8-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
              "gemini-3-flash-preview"
            ];

            const prompt = [
              "Review a student React + Vite + TypeScript product catalog project.",
              "You have not seen the source files, so do not claim to have inspected them.",
              "Give exactly three practical suggestions for usability, accessibility, testing, or maintainability.",
              "Use a heading and a numbered list in Markdown.",
              "Keep the report under 180 words."
            ].join("\n");

            let lastError;

            for (const model of models) {
              console.log(`Trying model: ${model}`);
              let tryAnotherModel = false;

              for (let attempt = 1; attempt <= 4; attempt++) {
                try {
                  const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
                    {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": apiKey
                      },
                      body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { maxOutputTokens: 500 }
                      }),
                      signal: AbortSignal.timeout(60000)
                    }
                  );

                  if (response.status === 404) {
                    lastError = new Error(`Model unavailable: ${model}`);
                    console.log(lastError.message);
                    tryAnotherModel = true;
                    break;
                  }

                  if (response.status === 429 || response.status >= 500) {
                    const details = await response.text();
                    throw new Error(`HTTP ${response.status}: ${details}`);
                  }

                  if (!response.ok) {
                    throw new Error(
                      `Gemini HTTP ${response.status}: ${await response.text()}`
                    );
                  }

                  const data = await response.json();
                  const review = data.candidates?.[0]?.content?.parts
                    ?.map(part => part.text || "")
                    .join("")
                    .trim();

                  if (!review) {
                    throw new Error("Gemini returned an empty review.");
                  }

                  const fs = await import("node:fs/promises");
                  const date = new Intl.DateTimeFormat("en-CA", {
                    timeZone: "Asia/Manila",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                  }).format(new Date());

                  await fs.mkdir("reports", { recursive: true });
                  await fs.writeFile(
                    "reports/daily-review.md",
                    `# Daily Product Catalog Review\n\nDate: ${date}\n\n${review}\n`,
                    "utf8"
                  );

                  console.log(`Review saved successfully using ${model}.`);
                  return;
                } catch (error) {
                  lastError = error;
                  console.error(
                    `Attempt ${attempt}/4 failed: ${error.message}`
                  );

                  if (/HTTP 400|HTTP 401|HTTP 403/.test(error.message)) {
                    throw error;
                  }

                  if (attempt < 4) {
                    const delay = Math.min(5000 * (2 ** (attempt - 1)), 60000);
                    console.log(`Retrying in ${delay / 1000} seconds.`);
                    await sleep(delay);
                  }
                }
              }

              if (!tryAnotherModel && lastError) {
                console.log(`Moving to the next model after failures.`);
              }
            }

            throw lastError || new Error("All Gemini model attempts failed.");
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
