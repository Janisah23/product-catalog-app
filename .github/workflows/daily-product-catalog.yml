
name: Daily AI Product Catalog Improvement

on:
  workflow_dispatch:
  schedule:
    # 5:00 PM Philippines time (09:00 UTC)
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: daily-product-catalog
  cancel-in-progress: false

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout product catalog app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Request a Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error("GEMINI_API_KEY repository secret is missing.");
            }

            const modelNames = [
              "gemini-3.8-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
              "gemini-3-flash-preview"
            ];

            const prompt = [
              "You are reviewing a student React product catalog application.",
              "Give exactly three concise, actionable code-review suggestions.",
              "Focus on usability, accessibility, or maintainability.",
              "Do not generate code, patches, or diffs.",
              "Do not claim to have inspected files you have not seen.",
              "Use a numbered list and stay under 120 words."
            ].join("\n");

            let lastError;

            for (const modelName of modelNames) {
              console.log(`Trying model: ${modelName}`);

              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`,
                    {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": apiKey
                      },
                      body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { maxOutputTokens: 350 }
                      })
                    }
                  );

                  if (response.status === 404) {
                    const details = await response.text();
                    console.log(`Model unavailable: ${modelName}. ${details}`);
                    lastError = new Error(`HTTP 404 for ${modelName}`);
                    break;
                  }

                  if (response.status === 429 || response.status >= 500) {
                    throw new Error(
                      `Temporary HTTP ${response.status}: ${await response.text()}`
                    );
                  }

                  if (!response.ok) {
                    throw new Error(
                      `Gemini HTTP ${response.status}: ${await response.text()}`
                    );
                  }

                  const data = await response.json();
                  const review = data.candidates?.[0]?.content?.parts
                    ?.map(part => part.text || "")
                    .join("")
                    .trim();

                  if (!review) {
                    throw new Error("Gemini returned an empty review.");
                  }

                  console.log(`Gemini review completed using ${modelName}.`);
                  console.log(review);
                  return;
                } catch (error) {
                  lastError = error;
                  console.error(
                    `Attempt ${attempt}/3 failed: ${error.message}`
                  );

                  if (/HTTP 400|HTTP 401|HTTP 403/.test(error.message)) {
                    throw error;
                  }

                  if (attempt < 3) {
                    await sleep(attempt * 2000);
                  }
                }
              }
            }

            throw lastError || new Error("No usable Gemini model was found.");
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
