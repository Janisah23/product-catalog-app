
name: Daily AI Product Catalog Improvement

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: daily-product-catalog
  cancel-in-progress: false

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout product catalog app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Request a small Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function main() {
            if (!process.env.GEMINI_API_KEY) {
              throw new Error("GEMINI_API_KEY repository secret is missing.");
            }

            const modelsResponse = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models?key=${process.env.GEMINI_API_KEY}`
            );

            if (!modelsResponse.ok) {
              throw new Error(`Model discovery failed: HTTP ${modelsResponse.status}`);
            }

            const modelData = await modelsResponse.json();
            const model = (modelData.models || []).find(item =>
              item.supportedGenerationMethods?.includes("generateContent") &&
              /flash/i.test(item.name)
            );

            if (!model) {
              throw new Error("No available Flash model supports generateContent.");
            }

            const modelName = model.name.replace(/^models\//, "");
            console.log(`Using available model: ${modelName}`);

            const prompt = [
              "You are reviewing a student React product catalog application.",
              "Do not generate code or a patch.",
              "Give exactly three concise, actionable code-review suggestions.",
              "Focus on usability, accessibility, or maintainability.",
              "Do not claim to have inspected files you have not seen."
            ].join("\n");

            let lastError;

            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const response = await fetch(
                  `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${process.env.GEMINI_API_KEY}`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: {
                        maxOutputTokens: 500,
                        temperature: 0.2
                      }
                    })
                  }
                );

                if (response.status === 429 || response.status >= 500) {
                  throw new Error(`Temporary Gemini HTTP ${response.status}`);
                }

                if (!response.ok) {
                  throw new Error(`Gemini HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                const candidate = data.candidates?.[0];
                const text = candidate?.content?.parts
                  ?.map(part => part.text || "")
                  .join("")
                  .trim();

                if (!text || candidate.finishReason === "MAX_TOKENS") {
                  throw new Error("Gemini returned empty or truncated output.");
                }

                console.log("Gemini review completed successfully.");
                console.log(text);
                return;
              } catch (error) {
                lastError = error;
                console.log(`Attempt ${attempt}/4 failed: ${error.message}`);

                if (attempt < 4) {
                  await sleep(attempt * 2000);
                }
              }
            }

            throw lastError || new Error("Gemini request failed.");
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
