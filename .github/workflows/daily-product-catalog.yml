
name: Daily AI Product Catalog Improvement

on:
  workflow_dispatch:
  schedule:
    # 5:00 PM Philippines time (09:00 UTC)
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: daily-product-catalog
  cancel-in-progress: false

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate daily Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error("GEMINI_API_KEY secret is missing.");
            }

            const response = await fetch(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-goog-api-key": apiKey
                },
                body: JSON.stringify({
                  contents: [{
                    parts: [{
                      text: [
                        "Review a student React + Vite + TypeScript product catalog project.",
                        "You have not been given its source files, so do not claim to have inspected them.",
                        "Write exactly three practical suggestions for improving usability, accessibility, testing, or maintainability.",
                        "Avoid repeating generic advice where possible.",
                        "Return Markdown with a short heading and a numbered list.",
                        "Keep the report under 180 words."
                      ].join("\n")
                    }]
                  }],
                  generationConfig: {
                    maxOutputTokens: 500
                  }
                })
              }
            );

            if (!response.ok) {
              throw new Error(
                `Gemini HTTP ${response.status}: ${await response.text()}`
              );
            }

            const data = await response.json();
            const review = data.candidates?.[0]?.content?.parts
              ?.map(part => part.text || "")
              .join("")
              .trim();

            if (!review) {
              throw new Error("Gemini returned an empty review.");
            }

            const date = new Date().toISOString().slice(0, 10);
            const fs = await import("node:fs/promises");

            await fs.mkdir("reports", { recursive: true });
            await fs.writeFile(
              "reports/daily-review.md",
              `# Daily Product Catalog Review\n\nDate: ${date}\n\n${review}\n`,
              "utf8"
            );

            console.log("Saved reports/daily-review.md");
            console.log(review);
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Commit and push daily review
        env:
          GH_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
          GH_NAME: ${{ secrets.COMMIT_AUTHOR_NAME }}
        run: |
          set -euo pipefail

          git config user.name "${GH_NAME:-github-actions[bot]}"
          git config user.email "${GH_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

          git add reports/daily-review.md

          if git diff --cached --quiet; then
            echo "The report has not changed. No commit is needed."
            exit 0
          fi

          git commit -m "docs: add daily AI product catalog review"
          git push origin HEAD:main
